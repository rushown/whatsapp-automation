services:
  - type: web
    name: whatsapp-automation-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_VERIFY_TOKEN
        generateValue: true
      - key: FRONTEND_URL
        value: https://surajdai.vercel.app
    healthCheckPath: /api/health